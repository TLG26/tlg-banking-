<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

<body>
  <h1>TLG Banking</h1>
  <p>Securely connect your bank account.</p>

  <button id="connect-bank">Connect Your Bank Account</button>

  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>

  <script>
    document.getElementById("connect-bank").addEventListener("click", async function () {
      try {
        const {
  Configuration,
  PlaidApi,
  PlaidEnvironments,
  Products,
  CountryCode,
} = require("plaid");

const configuration = new Configuration({
  basePath: PlaidEnvironments[process.env.PLAID_ENV || "sandbox"],
  baseOptions: {
    headers: {
      "PLAID-CLIENT-ID": process.env.PLAID_CLIENT_ID,
      "PLAID-SECRET": process.env.PLAID_SECRET,
    },
  },
});

const plaidClient = new PlaidApi(configuration);

module.exports = async function handler(req, res) {
  if (req.method !== "POST") {
    return res.status(405).json({
      error: "Method not allowed",
    });
  }

  try {
    const response = await plaidClient.linkTokenCreate({
      user: {
        client_user_id: "tlg-test-user",
      },
      client_name: "TLG Banking",
      products: [Products.Auth],
      country_codes: [CountryCode.Us],
      language: "en",
    });

    return res.status(200).json({
      link_token: response.data.link_token,
    });
  } catch (error) {
    console.error(error.response?.data || error);

    return res.status(500).json({
      error: error.response?.data || error.message || "Unknown error",
    });
  }
};

            console.log(public_token, metadata);
          },

          onExit: function (err, metadata) {
            console.log(err, metadata);
          }
        });

        handler.open();

      } catch (error) {
        console.error(error);
        alert("Could not start bank connection.");
      }
    });
  </script>
</body>
</html>
